name: ci

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      matrix:
        varnish_version:
          - "7.5"
          - "7.6"
          - "7.7"
          - "8.0"

    concurrency:
      group: ${{ github.ref_name != 'main' && format('{0}-{1}-{2}', github.workflow, github.ref, matrix.varnish_version) || github.sha }}
      cancel-in-progress: ${{ github.ref_name != 'main' }}

    steps:
      - uses: actions/checkout@v4

      - run: docker compose build --build-arg "VARNISH_VERSION=${{ matrix.varnish_version }}"

      - run: docker compose run --rm test

  test-varnish-9-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The official 9.1 image is Debian-based; there is no 9.1 Alpine tag.
      - run: docker build --file Dockerfile.debian --build-arg VARNISH_VERSION=9.1.0 --tag querymodifier-test:9.1 .

      - run: docker run --rm --entrypoint /bin/sh querymodifier-test:9.1 -c 'make check && python3 test_querymodifier_generated.py --seed 2026 --cases 200'
